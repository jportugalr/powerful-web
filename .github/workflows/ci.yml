name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: powerful-web-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build runtime image
        run: >-
          docker build --pull --target runtime
          --label "org.opencontainers.image.source=https://github.com/jportugalr/powerful-web"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --tag "powerful-web-ci:${GITHUB_SHA}" .

      - name: Smoke-test clean container
        run: bash scripts/smoke-image.sh "powerful-web-ci:${GITHUB_SHA}"

      - name: Save validated image for publication
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker save --output powerful-web-image.tar "powerful-web-ci:${GITHUB_SHA}"

      - name: Upload validated image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerful-web-image-${{ github.sha }}
          path: powerful-web-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish validated image to GHCR
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build-and-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download validated image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: powerful-web-image-${{ github.sha }}
          path: powerful-web-image

      - name: Publish commit tag, then promote latest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REPOSITORY: ghcr.io/jportugalr/powerful-web
          LOCAL_IMAGE: powerful-web-ci:${{ github.sha }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker load --input powerful-web-image/powerful-web-image.tar
          docker image inspect "$LOCAL_IMAGE" >/dev/null

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

          docker tag "$LOCAL_IMAGE" "$IMAGE_REPOSITORY:$SHA_TAG"
          docker push "$IMAGE_REPOSITORY:$SHA_TAG"

          docker tag "$LOCAL_IMAGE" "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:latest"
