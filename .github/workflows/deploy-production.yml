name: Deploy production

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: powerful-web-production
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: Deploy latest image to VPS
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          POWERFUL_VPS_APP_DIR: ${{ vars.POWERFUL_VPS_APP_DIR }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          umask 077

          : "${VPS_HOST:?Set the production environment variable VPS_HOST}"
          : "${VPS_USER:?Set the production environment variable VPS_USER}"
          : "${POWERFUL_VPS_APP_DIR:?Set the production environment variable POWERFUL_VPS_APP_DIR}"
          : "${VPS_SSH_PRIVATE_KEY:?Set the VPS_SSH_PRIVATE_KEY environment secret}"
          : "${VPS_SSH_KNOWN_HOSTS:?Set the VPS_SSH_KNOWN_HOSTS environment secret}"
          : "${GHCR_TOKEN:?GITHUB_TOKEN is unavailable}"

          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$POWERFUL_VPS_APP_DIR" =~ ^/[A-Za-z0-9_./-]+$ ]]
          [[ "$POWERFUL_VPS_APP_DIR" != "/" && "$POWERFUL_VPS_APP_DIR" != *..* ]]

          ssh_dir="$(mktemp -d)"
          key_file="$ssh_dir/id_ed25519"
          known_hosts_file="$ssh_dir/known_hosts"
          cleanup() {
            rm -f -- "$key_file" "$known_hosts_file"
            rmdir -- "$ssh_dir"
          }
          trap cleanup EXIT

          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          ssh-keygen -y -P '' -f "$key_file" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$known_hosts_file" >/dev/null

          remote_command="$(cat <<EOF
          set -eu
          cd '$POWERFUL_VPS_APP_DIR'
          docker_config=\$(mktemp -d)
          cleanup() {
            rm -f -- "\$docker_config/config.json"
            rmdir -- "\$docker_config" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DOCKER_CONFIG="\$docker_config"
          docker login ghcr.io --username '$GHCR_USER' --password-stdin
          docker compose -f compose.vps.yaml pull web
          docker compose -f compose.vps.yaml up -d --no-build --wait --wait-timeout 180 web
          EOF
          )"

          printf '%s' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ConnectTimeout=15 \
            -i "$key_file" \
            "$VPS_USER@$VPS_HOST" \
            "$remote_command"
