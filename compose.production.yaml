name: powerful-web-production

services:
  web:
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    networks:
      default: {}
      edge:
        aliases:
          - powerful-web

networks:
  default: {}
  edge:
    external: true
    name: edge
